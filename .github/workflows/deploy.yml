name: Deploy

# A push to main is a production deploy. GitHub does not run the test suite:
# the local checks in .githooks/pre-push are mandatory before every push (see
# AGENTS.md / CLAUDE.md). This workflow only deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy midway.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # wrangler.toml is gitignored on purpose; it lives in a repository secret.
      - name: Write wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: printf '%s\n' "$WRANGLER_TOML" > wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
